<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login : Palace City Hotel</title>
<link rel="icon" type="image/png" href="/apple-touch-icon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="admin-body">

<div class="admin-login-wrap">
  <div class="admin-login-card">
    <a href="../index.html" class="logo">Palace<span>City</span></a>
    <p class="subtitle">Sign in to manage rooms, bookings and hotel content.</p>

    <div class="alert alert-error" id="errorAlert"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required placeholder="admin@palacecityhotel.com" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••" />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Sign In</button>
    </form>

    <p style="margin-top:24px;font-size:0.82rem;">
      <a href="../index.html" style="color:var(--deep-emerald);">← Back to website</a>
    </p>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
