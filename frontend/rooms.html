<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rooms &amp; Suites — Palace City Hotel</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="navbar solid" id="navbar">
  <div class="container nav-inner">
    <a href="index.html" class="logo">Palace<span>City</span></a>
    <nav class="nav-links" id="navLinks">
      <a href="index.html" data-page="index.html">Home</a>
      <a href="rooms.html" data-page="rooms.html" class="active">Rooms</a>
      <a href="services.html" data-page="services.html">Services</a>
      <a href="about.html" data-page="about.html">About</a>
      <a href="gallery.html" data-page="gallery.html">Gallery</a>
      <a href="contact.html" data-page="contact.html">Contact</a>
      <a href="booking.html" class="btn btn-gold">Book Now</a>
    </nav>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<section class="page-header">
  <div class="container">
    <h1>Rooms &amp; Suites</h1>
    <p class="breadcrumb"><a href="index.html">Home</a> / Rooms</p>
  </div>
</section>

<section>
  <div class="container">
    <div class="filters-bar">
      <div class="form-group">
        <label for="filterType">Room Type</label>
        <select id="filterType">
          <option value="">All Types</option>
          <option value="Standard">Standard</option>
          <option value="Deluxe">Deluxe</option>
          <option value="Executive Suite">Executive Suite</option>
          <option value="Presidential Suite">Presidential Suite</option>
          <option value="Family Room">Family Room</option>
        </select>
      </div>
      <div class="form-group">
        <label for="filterGuests">Guests</label>
        <select id="filterGuests">
          <option value="">Any</option>
          <option value="1">1+</option>
          <option value="2">2+</option>
          <option value="3">3+</option>
          <option value="4">4+</option>
        </select>
      </div>
      <div class="form-group">
        <label for="filterPrice">Max Price / Night</label>
        <select id="filterPrice">
          <option value="">Any Price</option>
          <option value="100">Up to ₦100,000</option>
          <option value="200">Up to ₦200,000</option>
          <option value="300">Up to ₦300,000</option>
          <option value="500">Up to ₦500,000</option>
        </select>
      </div>
      <button class="btn btn-primary" id="applyFilters">Search Rooms</button>
    </div>

    <div class="grid-3" id="roomsGrid">
      <div class="loader"><div class="spinner"></div><span>Loading rooms…</span></div>
    </div>
  </div>
</section>

<footer>
  <div class="container">
    <div class="footer-bottom">
      <span>© <span class="current-year"></span> Palace City Hotel. All rights reserved.</span>
      <span><a href="admin/login.html">Admin Login</a></span>
    </div>
  </div>
</footer>

<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script src="js/rooms.js"></script>
</body>
</html>
